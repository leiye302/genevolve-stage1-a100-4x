name: CPU contract and resume smoke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash scripts/bootstrap.sh --sources-only
      - run: python -m unittest discover -s tests -v
      - run: python run.py sft --dry-run
      - run: python run.py collect --dry-run
      - run: bash -n scripts/bootstrap.sh && bash -n scripts/run_all.sh
